<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velojson playground - The Velocity Project</title>
<meta name="description" content="Encode JSON to VSON bytes and decode bytes back to JSON, live in your browser.">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="apple-touch-icon" href="/assets/logo.png">
<style>html{background:#fff;color:#050505}html[data-theme=dark]{background:#151515;color:#fafafa}#app{visibility:hidden;animation:vtp-show 0s 3s forwards}@keyframes vtp-show{to{visibility:visible}}</style>
<noscript><style>#app{visibility:visible;animation:none}</style></noscript>
<script>(function(){var t=null;try{t=localStorage.getItem("vtd-preferred-theme")}catch(e){}if(t!="light"&&t!="dark"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}document.documentElement.setAttribute("data-theme",t)})()</script>
</head>
<body data-page="velojson-playground">
<div id="app"></div>
<noscript>The velojson playground encodes JSON to VSON and decodes it back, and needs JavaScript. See <a href="/projects/velojson/">velojson</a>.</noscript>
<script src="/build/playground.js" type="module"></script>
</body>
</html>
