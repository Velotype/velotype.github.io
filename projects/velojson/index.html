<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velojson (VSON) - The Velocity Project</title>
<meta name="description" content="A compact binary encoding for JSON, and a faster one when both sides share a schema.">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="apple-touch-icon" href="/assets/logo.png">
<style>html{background:#fff;color:#050505}html[data-theme=dark]{background:#151515;color:#fafafa}#app{visibility:hidden;animation:vtp-show 0s 3s forwards}@keyframes vtp-show{to{visibility:visible}}</style>
<noscript><style>#app{visibility:visible;animation:none}</style></noscript>
<script>(function(){var t=null;try{t=localStorage.getItem("vtd-preferred-theme")}catch(e){}if(t!="light"&&t!="dark"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}document.documentElement.setAttribute("data-theme",t)})()</script>
</head>
<body data-page="velojson">
<div id="app"></div>
<noscript>velojson (VSON): A compact binary encoding for JSON, and a faster one when both sides share a schema. See <a href="https://github.com/Velotype/velojson">GitHub</a>.</noscript>

</html>
